<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRT ⇄ Script Compare</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="favicon-16.png" sizes="16x16">
<link rel="icon" type="image/png" href="favicon-32.png" sizes="32x32">
<link rel="icon" type="image/png" href="favicon-192.png" sizes="192x192">
<link rel="icon" type="image/png" href="favicon-512.png" sizes="512x512">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js" defer></script>
<script src="js/i18n.js" defer></script>
<script src="js/doc.js" defer></script>
<script src="js/app.js" defer></script>
</head>
<body>

<header>
  <div class="langbar" role="group" aria-label="Language">
    <button type="button" data-lang="en" title="English">EN</button>
    <button type="button" data-lang="uk" title="Українська">УКР</button>
    <button type="button" data-lang="ru" title="Русский">РУС</button>
  </div>
  <h1>SRT ⇄ Script Compare</h1>
  <p class="sub" data-i18n="sub"></p>
</header>

<main>

  <!-- Шаг 1: входные данные -->
  <section class="step">
    <h2><span class="n">1</span> <span data-i18n="step1"></span></h2>
    <div class="inputs">
      <div class="panel">
        <div class="panel-head">
          <h3 data-i18n="srtPanel"></h3>
          <label class="filebtn"><span data-i18n="srtLoad"></span>
            <input type="file" id="srtFile" accept=".srt,.txt">
          </label>
        </div>
        <textarea id="srtInput" spellcheck="false" data-i18n-ph="srtPh"></textarea>
        <div class="hint" id="srtCount"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3 data-i18n="docPanel"></h3>
          <label class="filebtn"><span data-i18n="docLoad"></span>
            <input type="file" id="docFile" accept=".docx,.doc,.txt">
          </label>
        </div>
        <textarea id="docInput" spellcheck="false" data-i18n-ph="docPh"></textarea>
        <div class="hint" id="docCount"></div>
        <div class="note" id="docNote" hidden></div>
      </div>
    </div>

    <div class="options">
      <label><input type="checkbox" id="optStrike" checked>
        <span data-i18n-html="optStrike"></span></label>
      <label><input type="checkbox" id="optDash" checked>
        <span data-i18n-html="optDash"></span></label>
      <label><input type="checkbox" id="optRemoveEmpty" checked>
        <span data-i18n-html="optRemoveEmpty"></span></label>
    </div>

    <button id="btnCompare" class="primary" data-i18n="btnCompare"></button>
  </section>

  <!-- Шаг 2 и 3: результаты -->
  <section class="step" id="results" hidden>
    <h2><span class="n">2</span> <span data-i18n="step2"></span>
      <small data-i18n="step2note"></small></h2>

    <div class="statsbar">
      <span id="stats"></span>
      <span id="appliedCounter"></span>
      <span class="grow"></span>
      <button id="btnAll" class="mini" data-i18n="btnAll"></button>
      <button id="btnNone" class="mini" data-i18n="btnNone"></button>
    </div>

    <div class="legend">
      <span class="lg"><span class="sw del"></span> <span data-i18n="legendDel"></span></span>
      <span class="lg"><span class="sw ins"></span> <span data-i18n="legendIns"></span></span>
      <span class="lg"><span class="sw off"></span> <span data-i18n="legendOff"></span></span>
      <span class="lg"><span class="bm-demo">12</span> <span data-i18n="legendBlock"></span></span>
    </div>

    <div id="diffView" class="diff"></div>

    <h2><span class="n">3</span> <span data-i18n="step3"></span>
      <small data-i18n="step3note"></small></h2>
    <textarea id="output" class="out" spellcheck="false" readonly></textarea>
    <div class="actions">
      <button id="btnCopy" data-i18n="btnCopy"></button>
      <button id="btnDownload" class="primary" data-i18n="btnDownload"></button>
    </div>
  </section>

  <details class="rules">
    <summary data-i18n="rulesSummary"></summary>
    <ul>
      <li data-i18n-html="r1"></li>
      <li data-i18n-html="r2"></li>
      <li data-i18n-html="r3"></li>
      <li data-i18n-html="r4"></li>
      <li data-i18n-html="r5"></li>
      <li data-i18n-html="r6"></li>
      <li data-i18n-html="r7"></li>
      <li data-i18n-html="r8"></li>
      <li data-i18n-html="r9"></li>
      <li data-i18n-html="r10"></li>
      <li data-i18n-html="r11"></li>
      <li data-i18n-html="r12"></li>
      <li data-i18n-html="r13"></li>
      <li data-i18n-html="r14"></li>
      <li data-i18n-html="r15"></li>
      <li data-i18n-html="r16"></li>
    </ul>
  </details>

</main>

<footer data-i18n="footer"></footer>

</body>
</html>
